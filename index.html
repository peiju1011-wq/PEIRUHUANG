}

    intent === "Collection inquiry"
        ? "https://formspree.io/f/meaqlkal"
        : "https://formspree.io/f/xzebagbv";

setStatus("Sending...");

const response = await fetch(endpoint, {
    method: "POST",
    body: data,
    headers: {
        "Accept": "application/json"
    }
});

if (response.ok) {
    setStatus("SUCCESS");
    form.reset();
} else {
    setStatus("ERROR");
}
